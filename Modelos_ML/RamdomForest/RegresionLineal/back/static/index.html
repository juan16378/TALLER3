<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predicción de Precio de Vivienda</title>
<style>
  :root {
    --primary: #79aec8;
    --primary-fg: #fff;
    --secondary: #417690;
    --accent: #f5dd5d;
    --primary-hover: #609ab6;
    --body-fg: #333;
    --body-bg: #f8f8f8;
    --body-quiet-color: #666;
    --header-color: #f9f9f2;
    --header-bg: var(--secondary);
    --header-branding-color: var(--accent);
    --breadcrumbs-fg: #c4dce8;
    --breadcrumbs-bg: var(--primary);
    --module-bg: #fff;
    --module-header-bg: #79aec8;
    --border-color: #ccc;
    --hairline-color: #e8e8e8;
    --message-success-bg: #dfd;
    --message-success-fg: #2d6a2d;
    --message-success-border: #b4e2b4;
    --message-error-bg: #ffefef;
    --message-error-fg: #ba2121;
    --message-error-border: #f5b6b6;
    --font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--body-bg);
    font-family: var(--font-family);
    color: var(--body-fg);
    font-size: 14px;
  }

  /* ===== Header (estilo "Django administration") ===== */
  #header {
    background: var(--header-bg);
    color: var(--header-color);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #branding h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  #branding h1 a {
    color: var(--header-color);
    text-decoration: none;
  }

  #branding h1 .brand-accent {
    color: var(--header-branding-color);
    font-weight: 700;
  }

  #header .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--header-color);
    opacity: 0.9;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d1d5db;
    flex-shrink: 0;
  }

  .dot.ok { background: #79d47f; }
  .dot.fail { background: #f08a8a; }
  .dot.pending { animation: pulse 1.1s ease-in-out infinite; background: #f5dd5d; }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ===== Breadcrumbs ===== */
  .breadcrumbs {
    background: var(--breadcrumbs-bg);
    color: var(--breadcrumbs-fg);
    padding: 8px 24px;
    font-size: 0.78rem;
  }

  .breadcrumbs a {
    color: #fff;
    text-decoration: none;
  }

  .breadcrumbs a:hover { text-decoration: underline; }

  /* ===== Contenido ===== */
  #content {
    max-width: 560px;
    margin: 32px auto;
    padding: 0 20px;
  }

  .module {
    background: var(--module-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .module h2 {
    margin: 0;
    background: var(--module-header-bg);
    color: var(--primary-fg);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 10px 16px;
  }

  .module .module-body {
    padding: 20px;
  }

  .module .description {
    color: var(--body-quiet-color);
    font-size: 0.85rem;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  /* ===== Formulario (estilo admin form-row) ===== */
  .form-row {
    margin-bottom: 16px;
  }

  .form-row label {
    display: block;
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--body-fg);
    margin-bottom: 6px;
  }

  .field-wrap {
    position: relative;
  }

  .field-wrap .unit {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--body-quiet-color);
    font-size: 0.85rem;
    font-weight: 600;
    pointer-events: none;
  }

  input[type="number"] {
    width: 100%;
    padding: 9px 44px 9px 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 0.95rem;
    font-family: var(--font-family);
    color: var(--body-fg);
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(65, 118, 144, 0.15);
  }

  .help {
    color: var(--body-quiet-color);
    font-size: 0.76rem;
    margin: 6px 0 0;
  }

  /* ===== Submit row (botón estilo Django admin) ===== */
  .submit-row {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline-color);
  }

  button {
    width: 100%;
    padding: 10px 16px;
    border: none;
    border-radius: 4px;
    background: var(--secondary);
    color: var(--primary-fg);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:hover:not(:disabled) { background: var(--primary-hover); }
  button:disabled { opacity: 0.65; cursor: not-allowed; }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  button.loading .spinner { display: inline-block; }
  button.loading .btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Mensajes (estilo Django messages framework) ===== */
  .messagelist {
    list-style: none;
    margin: 0 0 20px;
    padding: 0;
  }

  .messagelist li,
  .result-box,
  .error-box {
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 0.85rem;
    display: none;
    border: 1px solid transparent;
  }

  .result-box {
    background: var(--message-success-bg);
    color: var(--message-success-fg);
    border-color: var(--message-success-border);
  }

  .result-box .result-label {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    display: block;
  }

  .result-box .price {
    font-size: 1.55rem;
    font-weight: 700;
    display: block;
    margin-top: 4px;
  }

  .result-box .price-sub {
    font-size: 0.78rem;
    font-weight: 500;
    display: block;
    margin-top: 2px;
    opacity: 0.85;
  }

  .error-box {
    background: var(--message-error-bg);
    color: var(--message-error-fg);
    border-color: var(--message-error-border);
    font-weight: 600;
  }

  /* ===== Pie ===== */
  footer {
    text-align: center;
    color: var(--body-quiet-color);
    font-size: 0.75rem;
    padding: 24px 0 40px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #264b5d;
      --secondary: #1b3a47;
      --primary-hover: #2d5468;
      --body-fg: #eeeeee;
      --body-bg: #0f1113;
      --body-quiet-color: #a3a3a3;
      --header-color: #f1f1f1;
      --header-branding-color: #f5dd5d;
      --breadcrumbs-fg: #d0d0d0;
      --module-bg: #191c1f;
      --module-header-bg: #264b5d;
      --border-color: #333;
      --hairline-color: #2a2d31;
      --message-success-bg: #10261a;
      --message-success-fg: #7cd992;
      --message-success-border: #1e4630;
      --message-error-bg: #2a1414;
      --message-error-fg: #f28b8b;
      --message-error-border: #4a2226;
    }

    input[type="number"] { background: #14171a; color: var(--body-fg); }
  }
</style>
</head>
<body>

<div id="header">
  <div id="branding">
    <h1><a href="#"><span class="brand-accent">Regresión</span> Lineal</a></h1>
  </div>
  <div class="status-pill">
    <span class="dot pending" id="status-dot"></span>
    <span id="status-text">Verificando API…</span>
  </div>
</div>

<div class="breadcrumbs">
  <a href="#">Inicio</a> › Predicción de precio de vivienda
</div>

<div id="content">

  <div class="module">
    <h2>Predicción de precio de vivienda</h2>
    <div class="module-body">
      <p class="description">Estimá el valor de una vivienda a partir de su área, usando un modelo de regresión lineal entrenado.</p>

      <ul class="messagelist">
        <li class="result-box" id="result">
          <span class="result-label">Precio estimado</span>
          <span class="price" id="result-price"></span>
          <span class="price-sub" id="result-sub"></span>
        </li>
        <li class="error-box" id="error"></li>
      </ul>

      <form id="predict-form">
        <div class="form-row">
          <label for="area">Área de la vivienda</label>
          <div class="field-wrap">
            <input type="number" id="area" name="area" min="1" step="0.1" placeholder="82.5" required>
            <span class="unit">m²</span>
          </div>
          <p class="help">Ingresá un valor mayor a 0.</p>
        </div>

        <div class="submit-row">
          <button type="submit" id="submit-btn">
            <span class="spinner"></span>
            <span class="btn-label">Calcular precio estimado</span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>

<footer>Taller 3 · Regresión Lineal</footer>

<script>
  // Esta copia la sirve la propia API (mismo origen), por eso las rutas son relativas.
  const API_BASE_URL = "";

  const form = document.getElementById("predict-form");
  const areaInput = document.getElementById("area");
  const submitBtn = document.getElementById("submit-btn");
  const resultBox = document.getElementById("result");
  const resultPrice = document.getElementById("result-price");
  const resultSub = document.getElementById("result-sub");
  const errorBox = document.getElementById("error");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  const priceFormatter = new Intl.NumberFormat("es-CO", {
    style: "currency",
    currency: "COP",
    maximumFractionDigits: 0,
  });

  function hideMessages() {
    resultBox.style.display = "none";
    errorBox.style.display = "none";
  }

  function showError(message) {
    hideMessages();
    errorBox.textContent = message;
    errorBox.style.display = "block";
  }

  function showResult(price, area) {
    hideMessages();
    resultPrice.textContent = priceFormatter.format(price);
    resultSub.textContent = `para ${area} m²`;
    resultBox.style.display = "block";
  }

  function setStatus(state, text) {
    statusDot.classList.remove("ok", "fail", "pending");
    statusDot.classList.add(state);
    statusText.textContent = text;
  }

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/health`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (data.model_loaded) {
        setStatus("ok", "API conectada y modelo cargado.");
      } else {
        setStatus("fail", "API conectada, pero el modelo no cargó.");
      }
    } catch (err) {
      setStatus("fail", "No se pudo conectar con la API.");
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMessages();

    const area = parseFloat(areaInput.value);
    if (!area || area <= 0) {
      showError("Ingresá un área válida mayor a 0.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add("loading");

    try {
      const res = await fetch(`${API_BASE_URL}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ area_m2: area }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => null);
        throw new Error(errData?.detail || `Error del servidor (${res.status})`);
      }

      const data = await res.json();
      showResult(data.predicted_price, data.area_m2);
    } catch (err) {
      showError(err.message || "Ocurrió un error al calcular el precio.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove("loading");
    }
  });

  checkHealth();
</script>

</body>
</html>
